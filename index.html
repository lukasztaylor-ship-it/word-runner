<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Runner</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10182b;color:white;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(1000px,98vw)}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{font-size:26px}button{cursor:pointer;border:0;border-radius:12px;background:#ffcc55;color:#17213a;font-weight:800;padding:12px 18px}#stage{position:relative;background:#192d4e;border:3px solid #5b769d;border-radius:16px;overflow:hidden}canvas{width:100%;display:block}#overlay{position:absolute;inset:0;background:#10182be8;display:grid;place-content:center;text-align:center;padding:24px}#overlay.hidden{display:none}#choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}#choices button{background:#344d79;color:white}#choices button.active{background:#ffcc55;color:#17213a}#feedback{text-align:center;min-height:30px;font-weight:bold;margin-top:10px}.sub{text-align:center;color:#b2c6e5}
</style>
<main><header><h1>🏃 Word Runner</h1><strong>⭐ <span id="score">0</span> &nbsp; ❤️ <span id="lives">3</span> &nbsp; ⚡ <span id="speed">1.0</span>x</strong><span><button id="sound" aria-label="Toggle sound">🔊 Sound On</button> <button id="pause">Pause</button></span></header>
<div id="stage"><canvas id="game" width="1000" height="540"></canvas><div id="overlay"><section><h2 id="heading">WORD RUNNER</h2><p id="description">Pick the correct answer before it reaches you. Use A / S / D or click a lane.<br>Three lives. Each correct answer makes the game faster.</p><button id="start">Start Running ▶</button></section></div></div><div id="feedback" aria-live="polite"></div>
<div id="choices"><button data-lane="0">A · Upper</button><button data-lane="1">S · Middle</button><button data-lane="2">D · Lower</button></div><p class="sub">B2 vocabulary · Synonyms, definitions and Polish translations · Space to pause</p></main>
<script>

let audioCtx=null,soundEnabled=true;
function unlockAudio(){if(!soundEnabled)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}catch(e){}}
function beep(freq,duration=.12,type="square",volume=.065,delay=0,slide=0){if(!soundEnabled)return;unlockAudio();if(!audioCtx)return;const now=audioCtx.currentTime+delay,osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now);if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),now+duration);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(volume,now+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+duration+.02)}
function sfx(name){if(name==="move")beep(330,.055,"square",.025);if(name==="correct"){beep(523,.09,"square",.045);beep(659,.09,"square",.045,.10);beep(784,.17,"square",.05,.20)}if(name==="wrong"){beep(220,.24,"sawtooth",.06,0,-145);beep(110,.23,"square",.04,.18,-65)}if(name==="start"){beep(392,.10);beep(523,.10,"square",.05,.12);beep(784,.20,"square",.05,.24)}if(name==="over"){[392,330,262,131].forEach((f,i)=>beep(f,.22,"triangle",.075,i*.19))}if(name==="pause")beep(440,.09,"triangle",.035)}


const questions=[
["Synonym of reluctant","eager","unwilling","careless",1],["Polish for alleviate","pogorszyć","złagodzić","odrzucić",1],["Meaning of meticulous","very careful","very noisy","impatient",0],["Synonym of inevitable","avoidable","uncertain","unavoidable",2],["Polish for resilient","odporny","bezradny","wściekły",0],["Meaning of ambiguous","perfectly clear","open to interpretation","outdated",1],["Synonym of substantial","significant","trivial","temporary",0],["Polish for postpone","przyspieszyć","odłożyć","przewidzieć",1],["Meaning of plausible","believable","forbidden","exhausting",0],["Synonym of deteriorate","improve","worsen","stabilize",1],["Polish for scarce","rzadki","obfity","przyjazny",0],["Meaning of scrutinize","ignore","examine closely","praise publicly",1],["Synonym of profound","deep","shallow","ordinary",0],["Polish for comply","sprzeciwiać się","przestrzegać","przeszkadzać",1],["Meaning of counterproductive","having opposite effect","profitable","easy to maintain",0],["Synonym of tedious","exciting","boring","brief",1],["Polish for undermine","podważać","wzmacniać","udowadniać",0],["Meaning of feasible","practical and possible","expensive","prohibited",0],["Synonym of conspicuous","hidden","noticeable","fragile",1],["Polish for acknowledge","przyznać","ukryć","zapomnieć",0],["Meaning of unprecedented","never happened before","predictable","forgettable",0],["Synonym of vague","precise","unclear","accurate",1],["Polish for thorough","pobieżny","dokładny","chwilowy",1],["Meaning of mitigate","make less severe","complicate","refuse to discuss",0]];
const $=id=>document.getElementById(id),canvas=$("game"),ctx=canvas.getContext("2d"),lanes=[180,300,420];
$("sound").onclick=()=>{soundEnabled=!soundEnabled;$("sound").textContent=soundEnabled?"🔊 Sound On":"🔇 Sound Off";if(soundEnabled)sfx("move")};
let status="ready",score=0,lives=3,selected=1,question=questions[0],queue=[],seen=[],progress=0,scroll=0,last=0,flash=0,flashColor="#fff",runningTime=0;
function nextQuestion(){if(queue.length)return queue.shift();let available=questions.filter(q=>!seen.includes(q));if(!available.length){seen=[];available=questions}let q=available[Math.floor(Math.random()*available.length)];seen.push(q);return q}
function sync(){ $("score").textContent=score;$("lives").textContent=lives;$("speed").textContent=(1+score*.00045).toFixed(1);document.querySelectorAll("[data-lane]").forEach(b=>b.classList.toggle("active",+b.dataset.lane===selected))}
function newRound(){question=nextQuestion();progress=0;selected=1;sync()}
function choose(n){if(status!=="playing")return;if(selected!==n)sfx("move");selected=n;sync()}
function show(title,description,button){$("heading").textContent=title;$("description").textContent=description;$("start").textContent=button;$("overlay").classList.remove("hidden")}
function start(){sfx("start");score=0;lives=3;queue=[];seen=[];runningTime=0;scroll=0;newRound();status="playing";$("overlay").classList.add("hidden");$("pause").textContent="Pause";$("feedback").textContent="";last=performance.now()}
function togglePause(){if(status==="playing"){sfx("pause");status="paused";show("Paused","Press Resume or Space to continue.","Resume ▶");$("pause").textContent="Resume"}else if(status==="paused"){sfx("pause");status="playing";$("overlay").classList.add("hidden");$("pause").textContent="Pause";last=performance.now()}}
function resolve(){let right=question[4];if(selected===right){sfx("correct");score+=100;flashColor="#5bf0a4";$("feedback").textContent="✓ Correct! +100 points"}else{sfx("wrong");lives--;queue.push(question);flashColor="#ff657d";$("feedback").textContent="✗ Correct: "+question[right+1]+" — this question will return"}flash=.65;sync();if(lives<=0){sfx("over");status="over";show("Game Over","Final score: "+score+" points","Play Again ↻")}else newRound()}
function rect(x,y,w,h,color,r=0){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function label(str,x,y,size=20,color="#fff"){ctx.fillStyle=color;ctx.textAlign="center";ctx.font="bold "+size+"px system-ui";ctx.fillText(str,x,y)}
function wrapped(str,x,y,maxWidth){let words=str.split(" "),line="",lines=[];ctx.font="bold 16px system-ui";for(let word of words){if(ctx.measureText(line+" "+word).width>maxWidth&&line){lines.push(line);line=word}else line+=(line?" ":"")+word}lines.push(line);lines.slice(0,3).forEach((s,i)=>label(s,x,y+i*20,16,"#1c2b47"))}
function render(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(status==="playing"){runningTime+=dt;progress+=dt/Math.max(2.5,7.4/(1+score*.00045));scroll+=dt*180*(1+score*.00045);if(progress>=1)resolve()}flash=Math.max(0,flash-dt);let grad=ctx.createLinearGradient(0,0,0,540);grad.addColorStop(0,"#152b58");grad.addColorStop(1,"#315f7b");ctx.fillStyle=grad;ctx.fillRect(0,0,1000,540);
for(let i=0;i<16;i++){let x=((i*130-scroll*.25)%1150+1150)%1150-100;ctx.fillStyle="#23476a";ctx.beginPath();ctx.moveTo(x,145);ctx.lineTo(x+100,65+i%4*20);ctx.lineTo(x+200,145);ctx.fill()}
rect(0,145,1000,335,"#203a55");lanes.forEach((y,i)=>{rect(0,y-43,1000,86,i===selected?"#395e80":"#2c4c69",8);for(let x=-90-scroll%90;x<1100;x+=90)rect(x,y+35,42,4,"#7792ab",2)});
let px=950-725*Math.min(1,progress);lanes.forEach((y,i)=>{rect(px-80,y-34,160,68,i===selected?"#ffce60":"#eef4ff",12);wrapped(question[i+1],px,y-3,145)});
let y=lanes[selected]+Math.sin(runningTime*18)*3;rect(117,y-28,35,40,"#68dfa9",8);ctx.fillStyle="#ffd2a2";ctx.beginPath();ctx.arc(135,y-39,16,0,Math.PI*2);ctx.fill();rect(120,y-54,29,10,"#293a59",5);ctx.strokeStyle="#ffce60";ctx.lineWidth=8;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(132,y+12);ctx.lineTo(118,y+32);ctx.lineTo(99,y+32+Math.sin(runningTime*20)*8);ctx.moveTo(132,y+12);ctx.lineTo(150,y+32-Math.sin(runningTime*20)*8);ctx.stroke();
rect(180,14,640,90,"#0b1939",16);label(question[0],500,53,27);label("Choose a lane: A / S / D",500,84,16,"#b6cce6");rect(210,116,580,9,"#142747",5);rect(210,116,580*Math.min(progress,1),9,"#ffce60",5);if(flash>0){ctx.globalAlpha=flash*.28;rect(0,0,1000,540,flashColor);ctx.globalAlpha=1}requestAnimationFrame(render)}
document.querySelectorAll("[data-lane]").forEach(b=>b.onclick=()=>choose(+b.dataset.lane));document.addEventListener("keydown",e=>{let n={a:0,s:1,d:2,ArrowUp:0,ArrowDown:2}[e.key];if(n!==undefined){e.preventDefault();choose(n)}if(e.code==="Space"){e.preventDefault();togglePause()}});canvas.addEventListener("pointerdown",e=>{let r=canvas.getBoundingClientRect(),y=(e.clientY-r.top)*540/r.height;choose(y<240?0:y<360?1:2)});$("pause").onclick=togglePause;$("start").onclick=()=>status==="paused"?togglePause():start();sync();start();requestAnimationFrame(render);
</script></html>
